<svg width="1000" height="260"
xmlns="http://www.w3.org/2000/svg">


<defs>

<linearGradient id="bg"
x1="0"
y1="0"
x2="0"
y2="1">

<stop offset="0%"
stop-color="#fff0f5"/>

<stop offset="100%"
stop-color="#ffe4ec"/>

</linearGradient>

</defs>


<rect width="100%"
height="260"
fill="url(#bg)"/>


<!-- moon -->

<circle cx="850"
cy="70"
r="35"
fill="#fff8dc"/>


<!-- Sakura petals -->

<g fill="#ffb7c9">


<path d="M120 20 C100 0 80 30 120 50 C160 30 140 0 120 20Z">

<animateTransform
attributeName="transform"
type="translate"
from="0 -50"
to="40 300"
dur="6s"
repeatCount="indefinite"/>

</path>


<path d="M300 40 C280 20 260 50 300 70 C340 50 320 20 300 40Z">

<animateTransform
attributeName="transform"
type="translate"
from="0 -80"
to="-20 300"
dur="7s"
repeatCount="indefinite"/>

</path>


<path d="M520 10 C500 -10 480 20 520 40 C560 20 540 -10 520 10Z">

<animateTransform
attributeName="transform"
type="translate"
from="0 -40"
to="50 300"
dur="8s"
repeatCount="indefinite"/>

</path>


<path d="M720 60 C700 40 680 70 720 90 C760 70 740 40 720 60Z">

<animateTransform
attributeName="transform"
type="translate"
from="0 -100"
to="-40 300"
dur="6.5s"
repeatCount="indefinite"/>

</path>


<path d="M920 30 C900 10 880 40 920 60 C960 40 940 10 920 30Z">

<animateTransform
attributeName="transform"
type="translate"
from="0 -70"
to="20 300"
dur="7.5s"
repeatCount="indefinite"/>

</path>


</g>


<!-- characters -->


<text x="80"
y="220"
font-size="50">

🍮

</text>


<text x="150"
y="220"
font-size="50">

🐰

</text>


<text x="800"
y="220"
font-size="50">

🐰

</text>


<text x="870"
y="220"
font-size="50">

🌸

</text>


</svg>
